name: runtime

# Quickshell remains OWL 17 and uses a pinned matching oracle/fixture tree.
# The published Another catalogue is checked separately with tools/owl.jar (OWL 19).
on:
  pull_request:
    paths: ["runtimes/**", "tools/owl.jar", "tools/check-quickshell.sh", "widgets/**", "faces/**", ".github/workflows/runtime.yml"]
  push:
    branches: [main]
    paths: ["runtimes/**", "tools/owl.jar", "tools/check-quickshell.sh", "widgets/**", "faces/**", ".github/workflows/runtime.yml"]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Another catalogue with the current compiler
        run: |
          java -jar tools/owl.jar index .
          java -jar tools/owl.jar index . --faces
          java -jar tools/owl.jar index . --apps
      - name: Owl.js matches its supported upstream oracle
        run: tools/check-quickshell.sh
