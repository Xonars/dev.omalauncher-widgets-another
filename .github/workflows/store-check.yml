name: store-check
on:
  pull_request:
    paths: ["apps/**", "widgets/**", "faces/**", "local/**", "tests/store/**", "tools/**", "resources/**", "store-collection.json", ".github/workflows/store-check.yml"]
  push:
    branches: [oma-update-releases, oma-release]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build Ghost Letters resource bundle
        run: python3 tools/repack-ghost-letters.py
      - name: Store tests and resources
        run: |
          python3 -m unittest discover -s tests/store -v
          python3 tools/verify-local-store.py
      - name: Compile and verify catalogue
        run: |
          java -jar tools/owl.jar index .
          java -jar tools/owl.jar index . --faces
          java -jar tools/owl.jar index . --apps
          python3 tools/verify-local-store.py --catalogs
  ghost-balance:
    if: github.event_name == 'pull_request' && github.head_ref == 'ghost-letters-balance-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare 5000 matched seeds per engine
        run: |
          mkdir -p /tmp/ghost-baseline
          git archive e9ee844fbccf76d876d3831639a9b45fb30fa2d8 local/phone-widgets/ghost-letters | tar -x -C /tmp/ghost-baseline
          python3 tools/ghost-letters-benchmark.py --engine /tmp/ghost-baseline/local/phone-widgets/ghost-letters/game.py --games 5000 --output baseline.json
          python3 tools/ghost-letters-benchmark.py --engine local/phone-widgets/ghost-letters/game.py --games 5000 --output candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-letters-balance
          path: |
            baseline.json
            candidate.json
