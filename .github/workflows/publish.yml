name: publish

# Builds index.json from the reviewed widgets on main, faces.json from the faces and apps.json from
# the apps, and publishes the store to GitHub Pages. Faces and apps have catalogs of their own so
# launchers from before them never see one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # owl.jar dates each app by the commit that added it.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Owner-only catalog
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          for kind in ('widgets', 'faces', 'apps'):
              root = Path(kind)
              root.mkdir(exist_ok=True)
              unexpected = [str(p) for p in root.iterdir() if p.is_dir() and p.name != 'xonars']
              if unexpected:
                  raise SystemExit(f'Unexpected catalog authors: {unexpected}')
          CHECK
      - name: Catalog
        run: |
          java -jar tools/owl.jar index .
          java -jar tools/owl.jar index . --faces
          java -jar tools/owl.jar index . --apps
      - name: Verify catalog previews
        run: |
          python3 - <<'CHECK'
          import json
          from pathlib import Path
          for filename, kind in [('index.json', 'widgets'), ('apps.json', 'apps'), ('faces.json', 'faces')]:
              for entry in json.loads(Path(filename).read_text())[kind]:
                  preview = entry.get('preview')
                  if not preview or not Path(preview).is_file():
                      raise SystemExit(f"Missing preview: {entry['id']}")
                  if Path(preview).stat().st_size > 300 * 1024:
                      raise SystemExit(f"Preview too large: {preview}")
                  for theme, image in entry.get('themes', {}).items():
                      if not Path(image).is_file() or Path(image).stat().st_size > 100 * 1024:
                          raise SystemExit(f"Invalid theme preview: {entry['id']} / {theme}")
          CHECK
      - name: Site
        run: |
          mkdir _site
          cp -r index.json faces.json apps.json widgets faces apps w _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
